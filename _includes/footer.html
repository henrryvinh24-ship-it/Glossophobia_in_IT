<footer>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <span class="copyright">Copyright &copy; {{ site.title }} {{ 'now' | date: "%Y" }}</span>
            </div>
            <div class="col-md-4">
                <ul class="list-inline social-buttons">
                    {% for network in site.social %}
                    <li><a href="{{ network.url }}"><i class="fa fa-{{ network.title }}"></i></a>
                    </li>
                    {% endfor %}
                </ul>
            </div>
            <div class="col-md-4 text-right" style="line-height: 40px; color: #fed136; font-size: 13px;">
                <span>Project of Group 2 &bull; SE2106 &bull; SSA101 &bull; FPT University</span>
            </div>
        </div>

        <!-- Bộ đếm lượt truy cập thật từ Busuanzi -->
        <div class="row" style="margin-top: 10px;">
            <div class="col-md-12 text-center" style="font-size: 13px; color: #777;">
                <span id="busuanzi_container_site_pv">
                    <i class="fa fa-eye" style="color: #fed136;"></i> Total Views: <strong id="busuanzi_value_site_pv" style="color: #222;">...</strong>
                </span>
                <span style="margin: 0 10px;">|</span>
                <span id="busuanzi_container_site_uv">
                    <i class="fa fa-users" style="color: #fed136;"></i> Visitors: <strong id="busuanzi_value_site_uv" style="color: #222;">...</strong>
                </span>
            </div>
        </div>
    </div>

    <!-- Script kết nối trực tiếp đến máy chủ thống kê lượt truy cập thật -->
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</footer>
