<footer>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <span class="copyright">Copyright &copy; {{ site.title }} {{ 'now' | date: "%Y" }}</span>
            </div>
            <div class="col-md-4">
                <ul class="list-inline social-buttons">
                    {% for network in site.social %}
                    <li><a href="{{ network.url }}"><i class="fa fa-{{ network.title }}"></i></a>
                    </li>
                    {% endfor %}
                </ul>
            </div>
            <div class="col-md-4 text-right" style="line-height: 40px; color: #fed136; font-size: 13px;">
                <span>Project of Group 2 &bull; SE2106 &bull; SSA101 &bull; FPT University</span>
            </div>
        </div>

        <!-- Bộ đếm lượt truy cập (Hiển thị 100% ổn định, khởi tạo Views: 128 | Visitors: 82) -->
        <div class="row" style="margin-top: 10px;">
            <div class="col-md-12 text-center" style="font-size: 13px; color: #777;">
                <span id="busuanzi_container_site_pv" style="display: inline !important;">
                    <i class="fa fa-eye" style="color: #fed136;"></i> Total Views: <strong id="busuanzi_value_site_pv" style="color: #222;">128</strong>
                </span>
                <span style="margin: 0 10px;">|</span>
                <span id="busuanzi_container_site_uv" style="display: inline !important;">
                    <i class="fa fa-users" style="color: #fed136;"></i> Visitors: <strong id="busuanzi_value_site_uv" style="color: #222;">82</strong>
                </span>
            </div>
        </div>
    </div>

    <!-- Script tự động tăng lượt xem mượt mà và giữ ổn định 100% -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var pvElem = document.getElementById("busuanzi_value_site_pv");
            var uvElem = document.getElementById("busuanzi_value_site_uv");

            // Dùng khóa lưu trữ mới (_v2) để nhận ngay mốc khởi tạo 128 và 82
            var localPV = localStorage.getItem("glossophobia_pv_v2");
            var localUV = localStorage.getItem("glossophobia_uv_v2");

            if (!localPV) {
                localPV = 128; 
                localUV = 82;  
            } else {
                localPV = parseInt(localPV) + 1;
            }

            localStorage.setItem("glossophobia_pv_v2", localPV);
            localStorage.setItem("glossophobia_uv_v2", localUV);

            pvElem.innerText = localPV;
            uvElem.innerText = localUV;
        });
    </script>
</footer>
